<!DOCTYPE html>
<html lang="en">

<script src="https://d3js.org/d3.v5.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://d3js.org/d3-scale-chromatic.v1.min.js"></script>
<script src="https://d3js.org/d3-geo-projection.v2.min.js"></script>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded SVG</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            font-size: larger;
            background-color: #f0f0f0;
        }

        .top-bar {
            position: fixed;
            display: flex;
            justify-content: space-between;
            padding: 10px;
            width: 100%;
            background-color: #fff; /* Ensure the top bar has a background */
            box-shadow: 0px 4px 2px -2px gray; /* Optional shadow for better visibility */
            height: 50px; /* Set a fixed height for the top bar */
            z-index: 1000; /* Ensure the top bar is above other elements */
        }

        h1 {
            text-align: center;
        }

        h3 {
            align-self: first baseline;
            display: flex;
            margin-bottom: 10px;
            margin-top: 10px;
            margin-left: 10px;
        }

        .dropdown-container {
            align-self: flex-end;
            display: flex;
            margin-bottom: 10px;
            margin-top: 10px;
            margin-left: 10px;
        }

        select {
            position: relative;
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 10px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            margin-right: 30px;
        }

        
        .dropdown {
            position: relative;
            display: inline-block;
            margin-right: 30px;
        }

        .dropdown-toggle {
            background-color: #3498db;
            color: white;
            padding: 10px;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .dropdown-menu div {
            padding: 12px 16px;
            cursor: pointer;
        }

        .dropdown-menu div:hover {
            background-color: #f1f1f1;
        }

        .dropdown-menu input {
            margin-right: 10px;
        }

        .dropdown:hover .dropdown-menu {
            display: block;
        }

        .svg-container {
            display: flex;
            padding-top: 80px;
        }

        .svg-tremor, .svg-strength, .svg-sensation, .svg-bowel-bladder {
            flex: 1;
            position: relative;
        }

    </style>
</head>
<body>
    {% if patientId and data != {} %}
    <div class="top-bar">
    <h3>BrainWalk Data Avatar Visualizer</h3>
    <div class="dropdown-container">
        <select name="Gender" id="Gender">
            <option>Gender</option>
            <option>Neutral</option>
            <option>Female</option>
            <option>Male</option>
        </select>
        <div class="dropdown" id="bowel-bladder-options">
            <button class="dropdown-toggle">Bowel/Bladder</button>
            <div class="dropdown-menu" id="bowel-bladder-menu"></div>
        </div>
        <div class="dropdown" id="tremor-options">
            <button class="dropdown-toggle">Tremor</button>
            <div class="dropdown-menu" id="tremor-menu"></div>
        </div>
        <div class="dropdown" id="strength-options">
            <button class="dropdown-toggle">Strength</button>
            <div class="dropdown-menu" id="strength-menu"></div>
        </div>
        <div class="dropdown" id="sensation-options">
            <button class="dropdown-toggle">Sensation</button>
            <div class="dropdown-menu" id="sensation-menu"></div>
        </div>

    </div>
    </div>
    <div class="svg-container">
        <div class="svg-bowel-bladder">
            <h1>Bowel/Bladder</h1>
        </div>
        <div class="svg-tremor">
            <h1>Tremor</h1>
        </div>
        <div class="svg-strength">
            <h1>Strength</h1>
        </div>
        <div class="svg-sensation">
            <h1>Sensation</h1>
        </div>
    </div>
    <script>
        var surveyDataMap = {{ data | tojson }};
        var avatarUrl = "{{ url_for('static', filename='avatar_template/neutral.svg') }}"
    </script>
    <script type="module" src="{{ url_for('static', filename='js/render_avatar.js') }}" ></script>
    {% else %}
        <h1>No patient found. Please provide a valid patient ID.</h1>
    {% endif %}
    </body>
</html>
