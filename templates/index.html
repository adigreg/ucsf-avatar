<!DOCTYPE html>
<html lang="en">

<script src="https://d3js.org/d3.v5.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://d3js.org/d3-scale-chromatic.v1.min.js"></script>
<script src="https://d3js.org/d3-geo-projection.v2.min.js"></script>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded SVG</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            font-size: larger;
            background-color: #f0f0f0;
        }

        .top-bar {
            position: fixed;
            display: flex;
            justify-content: space-between;
            padding: 10px;
        }

        .button-container {
            align-self: first baseline;
            display: flex;
            margin-bottom: 10px;
            margin-top: 10px;
            margin-left: 10px;
        }

        .button {
            font-weight: bold;
            margin-right: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            color: #fff;
            background-color: #2980b9;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .dropdown-container {
            align-self: last baseline;
            display: flex;
            margin-bottom: 10px;
            margin-top: 10px;
            margin-left: 10px;
        }

        .button:last-child {
            margin-right: 0;
        }

        .button:hover {
            background-color: #2c3e50;
        }

        select {
            font-weight: bold;
            margin-right: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            color: #fff;
            background-color: #2980b9;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

    </style>
</head>
<body>
    {% if patientId and data != {} %}
    <div class="top-bar">
    <div class="button-container">
        <button class="button">Neutral</button>
        <button class="button">Male</button>
        <button class="button">Female</button>
    </div>
    <div class="dropdown-container">
        <select name="Cerebral" id="Cerebral"></select>
        <select name="Tremor" id="Tremor"></select>
        <select name="Strength" id="Strength"></select>
        <select name="Sensation" id="Sensation"></select>
    </div>
    </div>
    <div class="svg-container">
        <div class="svg-tremor"></div>
        <div class="svg-strength"></div>
        <div class="svg-sensation"></div>
    </div>
    <script>
        var surveyDataMap = {{ data | tojson }};
        var avatarUrl = "{{ url_for('static', filename='avatar_template/neutral.svg') }}"
    </script>
    <script type="module" src="{{ url_for('static', filename='js/render_avatar.js') }}" ></script>
    {% else %}
        <h1>No patient found. Please provide a valid patient ID.</h1>
    {% endif %}
    </body>
</html>
