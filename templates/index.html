<!DOCTYPE html>
<html lang="en">

<script src="https://d3js.org/d3.v5.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://d3js.org/d3-scale-chromatic.v1.min.js"></script>
<script src="https://d3js.org/d3-geo-projection.v2.min.js"></script>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded SVG</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            font-size: larger;
            background-color: #f0f0f0;
        }

        .top-bar {
            position: fixed;
            display: flex;
            justify-content: space-between;
            padding: 10px;
            width: 100%;
            background-color: #fff; /* Ensure the top bar has a background */
            box-shadow: 0px 4px 2px -2px gray; /* Optional shadow for better visibility */
            height: 50px; /* Set a fixed height for the top bar */
            z-index: 1000; /* Ensure the top bar is above other elements */
        }

        h3 {
            align-self: first baseline;
            display: flex;
            margin-bottom: 10px;
            margin-top: 10px;
            margin-left: 10px;
        }

        .dropdown-container {
            align-items: center;
            display: flex;
        }

        .dropdown-toggle, select {
            position: relative;
            display: inline-block;
            background-color: white;
            color: black;
            padding: 10px;
            font-size: 16px;
            border: black;
            cursor: pointer;
            margin-right: 30px;
            text-align: center;
            border-color: black;
            border-style: solid;
            border-radius: 36px;
        }

        
        .dropdown {
            position: relative;
            display: inline-block;
            margin-right: 30px;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            right: 0;
        }

        .dropdown-menu div {
            padding: 12px 16px;
            cursor: pointer;
        }

        .dropdown-menu div:hover {
            background-color: #f1f1f1;
        }

        .dropdown-menu input {
            margin-right: 10px;
        }

        .dropdown:hover .dropdown-menu {
            display: block;
        }

        .svg-container {
            display: flex;
            padding-top: 80px;
            height: auto;
        }

        .svg-column {
            flex: 1;
            position: relative;
        }

        .svg-column h2 {
            text-align: center;
        }

        .svg-bowel-bladder {
            position: relative;
            padding-top: 100px;
        }

        svg {
            display: block;
            margin: auto;
        }


    </style>
</head>
<body>
    {% if patientId and data != {} %}
    <div class="top-bar">
    <h3>BrainWalk Data Avatar Visualizer</h3>
    <div class="dropdown-container">
        <div class="dropdown" id="gender">
            <button class="dropdown-toggle">Gender<strong>&nbsp;&nbsp;&or;</strong></button>
            <div class="dropdown-menu" id="gender-menu">
                <div>
                    <input id="neutral" type="radio" name="genderOption" checked></input>
                    <label>Neutral</label>
                </div>
                <div>
                    <input id="female" type="radio" name="genderOption"></input>
                    <label>Female</label>
                </div>
                <div>
                    <input id="male" type="radio" name="genderOption"></input>
                    <label>Male</label>
                </div>
            </div>
        </div>
        <div class="dropdown" id="cerebral-options">
            <button class="dropdown-toggle">Cerebral<strong>&nbsp;&nbsp;&or;</strong></button>
            <div class="dropdown-menu" id="cerebral-menu"></div>
        </div>
        <div class="dropdown" id="bowel-bladder-options">
            <button class="dropdown-toggle">Bowel/Bladder<strong>&nbsp;&nbsp;&or;</strong></button>
            <div class="dropdown-menu" id="bowel-bladder-menu"></div>
        </div>
        <div class="dropdown" id="tremor-options">
            <button class="dropdown-toggle">Tremor<strong>&nbsp;&nbsp;&or;</strong></button>
            <div class="dropdown-menu" id="tremor-menu"></div>
        </div>
        <div class="dropdown" id="strength-options">
            <button class="dropdown-toggle">Strength<strong>&nbsp;&nbsp;&or;</strong></button>
            <div class="dropdown-menu" id="strength-menu"></div>
        </div>
        <div class="dropdown" id="sensation-options">
            <button class="dropdown-toggle">Sensation<strong>&nbsp;&nbsp;&or;</strong></button>
            <div class="dropdown-menu" id="sensation-menu"></div>
        </div>
    </div>
    </div>
    <div class="svg-container">
        <div class="svg-column svg-extras">
            <div class="svg-cerebral">
                <h2>Cerebral</h2>
            </div>
            <div class="svg-bowel-bladder">
                <h2>Bowel/Bladder</h2>
            </div>
        </div>
        <div class="svg-column svg-tremor">
            <h2>Tremor</h2>
        </div>
        <div class="svg-column svg-strength">
            <h2>Strength</h2>
        </div>
        <div class="svg-column svg-sensation">
            <h2>Sensation</h2>
        </div>
    </div>
    <script type="text/javascript">
        var surveyDataMap = {{ data | tojson }};
        var avatarUrl = "{{ url_for('static', filename='avatar_template/neutral.svg') }}";
        var headUrl = "{{ url_for('static', filename='avatar_template/head.svg') }}";
        var abdomenUrl = "{{ url_for('static', filename='avatar_template/abdomen.svg') }}";
    </script>
    <script type="module" src="{{ url_for('static', filename='js/render_avatar.js') }}" ></script>
    {% else %}
        <h2>No patient found. Please provide a valid patient ID.</h2>
    {% endif %}
    </body>
</html>
