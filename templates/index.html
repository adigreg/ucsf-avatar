<!DOCTYPE html>
<html lang="en">

<script src="https://d3js.org/d3.v5.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://d3js.org/d3-scale-chromatic.v1.min.js"></script>
<script src="https://d3js.org/d3-geo-projection.v2.min.js"></script>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded SVG</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            font-size: larger;
            background-color: #f0f0f0;
        }

        .top-bar {
            position: fixed;
            display: flex;
            justify-content: space-between;
            padding: 10px;
            width: 100%;
            background-color: #fff; /* Ensure the top bar has a background */
            box-shadow: 0px 4px 2px -2px gray; /* Optional shadow for better visibility */
            height: 50px; /* Set a fixed height for the top bar */
            z-index: 1000; /* Ensure the top bar is above other elements */
        }

        h1 {
            text-align: center;
        }

        h3 {
            align-self: first baseline;
            display: flex;
            margin-bottom: 10px;
            margin-top: 10px;
            margin-left: 10px;
        }

        .dropdown-container {
            align-self: flex-end;
            display: flex;
            margin-bottom: 10px;
            margin-top: 10px;
            margin-left: 10px;
        }

        select {
            font-weight: bold;
            font-size: 18px; /* Increase font size for larger text */
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            color: #fff;
            background-color: #2980b9;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-right: 20px;
        }

        .svg-container {
            display: flex;
            padding-top: 80px;
        }

        .svg-tremor, .svg-strength, .svg-sensation, .svg-bowel-bladder {
            flex: 1;
            position: relative;
        }

    </style>
</head>
<body>
    {% if patientId and data != {} %}
    <div class="top-bar">
    <h3>BrainWalk Data Avatar Visualizer</h3>
    <div class="dropdown-container">
        <select name="Gender" id="Gender">
            <option>Gender</option>
            <option>Neutral</option>
            <option>Female</option>
            <option>Male</option>
        </select>
        <select name="Bowel/Bladder" id="Bowel/Bladder">
            <option>Bowel/Bladder</option>
        </select>
        <select name="Tremor" id="Tremor">
            <option>Tremor</option>
        </select>
        <select name="Strength" id="Strength">
            <option>Strength</option>
        </select>
        <select name="Sensation" id="Sensation">
            <option>Sensation</option>
        </select>
    </div>
    </div>
    <div class="svg-container">
        <div class="svg-bowel-bladder">
            <h1>Bowel/Bladder</h1>
        </div>
        <div class="svg-tremor">
            <h1>Tremor</h1>
        </div>
        <div class="svg-strength">
            <h1>Strength</h1>
        </div>
        <div class="svg-sensation">
            <h1>Sensation</h1>
        </div>
    </div>
    <script>
        var surveyDataMap = {{ data | tojson }};
        var avatarUrl = "{{ url_for('static', filename='avatar_template/neutral.svg') }}"
    </script>
    <script type="module" src="{{ url_for('static', filename='js/render_avatar.js') }}" ></script>
    {% else %}
        <h1>No patient found. Please provide a valid patient ID.</h1>
    {% endif %}
    </body>
</html>
