<!DOCTYPE html>
<html lang="en">

<script src="https://d3js.org/d3.v5.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://d3js.org/d3-scale-chromatic.v1.min.js"></script>
<script src="https://d3js.org/d3-geo-projection.v2.min.js"></script>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded SVG</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }

        .button-container {
            display: flex;
            margin-bottom: 10px;
        }

        .button {
            margin-right: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            color: #fff;
            background-color: #2980b9;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .button:last-child {
            margin-right: 0;
        }

        .button:hover {
            background-color: #2c3e50;
        }

        .checkbox-container {
            position: fixed;
            top: 10px;
            right: 10px;
        }
    </style>
</head>
<body>
    {% if patientId and data != {} %}
    <div class="top-bar">
    <div class="button-container">
        <button class="button">Male</button>
        <button class="button">Female</button>
        <button class="button">Neutral</button>
    </div>
    </div>
    <script>
        var surveyDataMap = {{ data | tojson }};
        var avatarUrl = "{{ url_for('static', filename='avatar_template/neutral.svg') }}"
    </script>
    <script type="module" src="{{ url_for('static', filename='js/render_avatar.js') }}" ></script>
    <div class="checkbox-container">
        <p1>Limb Data</p1><br>
        <label><input id="feeling" type="checkbox" name="symptom" value="feeling" checked> Feeling</label><br>
        <label><input id="tremor" type="checkbox" name="symptom" value="tremor" checked> Tremor</label><br>
        <label><input id="spasm" type="checkbox" name="symptom" value="spasm" checked> Spasm</label><br>
        <label><input id="strength" type="checkbox" name="symptom" value="strength" checked> Strength</label><br>
        <label><input id="weakness" type="checkbox" name="symptom" value="weakness" checked> Weakness</label><br>
        <p1>Brain Health</p1>
        <label><input id="cognition" type="checkbox" name="symptom" value="feeling" checked> Feeling</label><br>
        <label><input id="fatigue" type="checkbox" name="symptom" value="tremor" checked> Tremor</label><br>
        <label><input id="depression" type="checkbox" name="symptom" value="feeling" checked> Feeling</label><br>
        <label><input id="anxiety" type="checkbox" name="symptom" value="tremor" checked> Tremor</label><br>
      </div>
    {% else %}
        <h1>No patient found. Please provide a valid patient ID.</h1>
    {% endif %}
    </body>
</html>
